name: nesmdb-triangle-patterns

on:
  push:
    branches:
      - agent/pulse-relationship-analysis-v1
    paths:
      - "src/chiptune_agent_kit/analysis/triangle_patterns.py"
      - "scripts/scan_nesmdb_triangle_patterns.py"
      - "tests/test_triangle_patterns.py"
      - ".github/workflows/nesmdb-triangle-patterns.yml"
  workflow_dispatch:

jobs:
  scan-triangle-corpus:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and downloader
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install gdown
      - name: Test Triangle detectors
        run: pytest -q tests/test_triangle_patterns.py
      - name: Download official NES-MDB MIDI dataset
        run: |
          mkdir -p .cache/nesmdb
          python -m gdown 1w2uo1Cmio4gz6nGUhZOtzF54kPkoKyo7 -O .cache/nesmdb/nesmdb_midi.tar.gz
          tar -xzf .cache/nesmdb/nesmdb_midi.tar.gz -C .cache/nesmdb
          echo "MIDI files: $(find .cache/nesmdb -type f -name '*.mid' | wc -l)"
      - name: Scan all Triangle patterns
        run: |
          python scripts/scan_nesmdb_triangle_patterns.py .cache/nesmdb \
            --micro-note-floor-seconds 0.001 \
            --window-seconds 8 \
            --step-seconds 4 \
            --progress-every 250 \
            --json-output artifacts/nesmdb_triangle_patterns.json \
            --markdown-output artifacts/nesmdb_triangle_patterns.md
      - name: Show summary
        run: cat artifacts/nesmdb_triangle_patterns.md
      - uses: actions/upload-artifact@v4
        with:
          name: nesmdb-triangle-patterns-v1
          path: |
            artifacts/nesmdb_triangle_patterns.json
            artifacts/nesmdb_triangle_patterns.md
          if-no-files-found: error
          retention-days: 30

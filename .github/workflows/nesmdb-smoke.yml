name: nesmdb-smoke

on:
  push:
    paths:
      - "src/chiptune_agent_kit/analysis/**"
      - "scripts/analyze_nesmdb_batch.py"
      - "scripts/build_pulse_casebook.py"
      - "scripts/build_pulse_window_casebook.py"
      - ".github/workflows/nesmdb-smoke.yml"
  workflow_dispatch:

jobs:
  analyze-real-data:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and downloader
        run: |
          python -m pip install -e .
          python -m pip install gdown

      - name: Download official NES-MDB MIDI dataset
        run: |
          mkdir -p .cache/nesmdb
          python -m gdown 1w2uo1Cmio4gz6nGUhZOtzF54kPkoKyo7 -O .cache/nesmdb/nesmdb_midi.tar.gz
          tar -xzf .cache/nesmdb/nesmdb_midi.tar.gz -C .cache/nesmdb

      - name: Analyze reproducible real-data sample
        run: |
          python scripts/analyze_nesmdb_batch.py .cache/nesmdb \
            --limit 96 \
            --sample-strategy random \
            --seed 20260814 \
            --output artifacts/nesmdb_sample_report.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/nesmdb_sample_report.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          print(json.dumps(d['sample'], indent=2))
          print(json.dumps(d['summary']['pulse_1_pulse_2'], indent=2))
          print(json.dumps(d['summary']['pulse_1_pulse_2_onset_sensitivity'], indent=2))
          PY

      - name: Build pulse relationship casebook
        run: |
          python scripts/build_pulse_casebook.py artifacts/nesmdb_sample_report.json \
            --count 5 \
            --json-output artifacts/pulse_casebook.json \
            --markdown-output artifacts/pulse_casebook.md
          cat artifacts/pulse_casebook.md

      - name: Inspect representative pulse windows
        run: |
          python scripts/build_pulse_window_casebook.py artifacts/pulse_casebook.json \
            --root .cache/nesmdb \
            --window-seconds 6 \
            --step-seconds 1 \
            --onset-tolerance-seconds 0.005 \
            --density-bin-seconds 0.5 \
            --max-event-rows 36 \
            --json-output artifacts/pulse_window_casebook.json \
            --markdown-output artifacts/pulse_window_casebook.md
          sed -n '1,260p' artifacts/pulse_window_casebook.md

      - uses: actions/upload-artifact@v4
        with:
          name: nesmdb-analysis-artifacts
          path: |
            artifacts/nesmdb_sample_report.json
            artifacts/pulse_casebook.json
            artifacts/pulse_casebook.md
            artifacts/pulse_window_casebook.json
            artifacts/pulse_window_casebook.md
          if-no-files-found: error

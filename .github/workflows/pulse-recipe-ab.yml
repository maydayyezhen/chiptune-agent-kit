name: pulse-recipe-ab

on:
  push:
    branches:
      - agent/pulse-relationship-analysis-v1
    paths:
      - 'src/chiptune_agent_kit/experiments/**'
      - 'scripts/build_pulse_recipe_ab_pack.py'
      - 'tests/test_pulse_recipe_ab.py'
      - '.github/workflows/pulse-recipe-ab.yml'
  workflow_dispatch:

jobs:
  build-listening-pack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run controlled experiment tests
        run: pytest -q tests/test_pulse_recipe_ab.py
      - name: Build MIDI and WAV A/B pack
        run: python scripts/build_pulse_recipe_ab_pack.py --output out/pulse_recipe_ab_v1
      - name: Show manifest
        run: cat out/pulse_recipe_ab_v1/manifest.json
      - name: Pack files
        run: zip -j out/pulse_recipe_ab_v1.zip out/pulse_recipe_ab_v1/*
      - uses: actions/upload-artifact@v4
        with:
          name: pulse-recipe-ab-v1
          path: out/pulse_recipe_ab_v1.zip
          if-no-files-found: error
          retention-days: 30

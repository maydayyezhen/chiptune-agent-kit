[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chiptune-agent-kit"
version = "0.1.0"
description = "Agent-friendly chiptune composition, reference analysis, and chip-target validation tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mido>=1.3,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
chiptune-analyze = "chiptune_agent_kit.cli:analyze_main"
chiptune-validate = "chiptune_agent_kit.cli:validate_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
